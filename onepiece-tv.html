<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+Hebrew:wght@300;400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+Hebrew:wght@300;400;600&display=swap" rel="stylesheet"></noscript>
  <title>One Piece ☠</title>
  <style>
    :root {
      --bg:       #06080e;
      --surface:  #0c1220;
      --surface2: #111927;
      --border:   rgba(255,255,255,0.07);
      --gold:     #c8940e;
      --gold2:    #f0c030;
      --gold3:    #ffe48a;
      --text:     #ede0c8;
      --text2:    #8a7a62;
      --text3:    #4a3e30;
      --ink:      #080400;
      --red:      #c02820;
      --tr:       .18s ease;
      --fc:       'Cinzel', Georgia, serif;
      --fi:       'Noto Sans Hebrew', sans-serif;
      --fu:       'Noto Sans Hebrew', sans-serif;
      --ft:       'Cinzel', Georgia, serif;
      --focus:    0 0 0 2px var(--gold2), 0 0 16px rgba(240,192,48,0.3);
      --fs-huge:   48px;
      --fs-title:  28px;
      --fs-saga:   20px;
      --fs-arc:    15px;
      --fs-card-n: 36px;
      --fs-card-t: 13px;
      --fs-card-s: 11px;
      --fs-ui:     16px;
      --fs-sm:     13px;
      --fs-hud:    18px;
      --fs-ctrl:   22px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg) repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.012) 2px,
        rgba(255,255,255,0.012) 4px
      );
      color: var(--text);
      font-family: var(--fu);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 100% 50% at 50% 0%, rgba(14,26,52,0.5) 0%, transparent 70%);
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* ── STARS ────────────────────────────────── */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 7%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 55% 4%, rgba(255,230,100,.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 10%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(2px 2px at 15% 20%, rgba(255,230,100,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 16%, rgba(255,255,255,.4) 0%, transparent 100%);
    }

    /* ── HEADER ──────────────────────────────── */
    #hdr {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(6,8,14,0.98) 0%, rgba(10,16,28,0.96) 100%);
      border-bottom: 1px solid rgba(200,148,14,0.2);
      padding: 16px 48px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 4px 24px rgba(0,0,0,0.6);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .lj {
      font-size: 40px;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(200,148,14,0.5));
      animation: jp 4s ease-in-out infinite;
    }

    @keyframes jp {
      0%, 100% { transform: scale(1) rotate(-3deg) }
      50%       { transform: scale(1.05) rotate(3deg) }
    }

    .lt {
      font-family: var(--fc);
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
      color: var(--gold2);
      text-shadow: 0 0 40px rgba(240,192,48,0.2);
    }

    .ls {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--text2);
      margin-top: 3px;
      text-transform: uppercase;
    }

    /* ── RESUME BUTTON ────────────────────────── */
    #btn-resume {
      display: none;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid rgba(200,148,14,0.4);
      border-radius: 10px;
      color: var(--gold2);
      font-weight: 600;
      font-size: var(--fs-ui);
      font-family: var(--fu);
      padding: 10px 22px;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      position: relative;
      transition: background var(--tr), border-color var(--tr), box-shadow var(--tr);
    }

    #btn-resume.on {
      display: flex;
    }

    @keyframes shimmer {
      0%   { transform: translateX(-180%) skewX(-20deg) }
      100% { transform: translateX(280%)  skewX(-20deg) }
    }

    #btn-resume::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: skewX(-20deg) translateX(-180%);
      animation: shimmer 2.8s ease infinite;
      pointer-events: none;
    }

    #btn-resume:hover, #btn-resume:focus {
      background: rgba(200,148,14,0.1);
      border-color: rgba(200,148,14,0.7);
      box-shadow: 0 0 16px rgba(200,148,14,0.15);
    }

    #btn-resume:hover::before, #btn-resume:focus::before {
      animation-duration: 1.4s;
    }

    .ri { font-size: 20px }

    .rt {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: right;
    }

    .rl {
      font-size: var(--fs-sm);
      opacity: .65;
      font-weight: 400;
    }

    .re {
      font-size: 18px;
      font-weight: 600;
    }

    /* ── SAGA NAV ─────────────────────────────── */
    #saga-nav {
      position: relative;
      z-index: 9;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      padding: 10px 48px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #saga-nav::-webkit-scrollbar {
      display: none;
    }

    .saga-tab {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid rgba(200,148,14,0.18);
      border-radius: 100px;
      color: var(--text2);
      font-size: var(--fs-arc);
      font-family: var(--fc);
      font-weight: 400;
      padding: 8px 20px;
      cursor: pointer;
      outline: none;
      transition: all var(--tr);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .saga-tab:hover, .saga-tab.fx {
      border-color: rgba(200,148,14,0.45);
      color: var(--text);
      background: rgba(200,148,14,0.07);
      transform: translateY(-1px);
    }

    .saga-tab:focus {
      outline: 2px solid var(--gold2);
      outline-offset: 2px;
    }

    .saga-tab.ac {
      background: var(--gold);
      color: var(--ink);
      font-weight: 700;
      border-color: var(--gold);
    }

    /* ── EPISODES SCROLL ──────────────────────── */
    #ep-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px 80px;
      scrollbar-width: thin;
      scrollbar-color: rgba(200,148,14,0.4) transparent;
      direction: rtl;
    }

    #ep-wrap::-webkit-scrollbar {
      width: 4px;
    }

    #ep-wrap::-webkit-scrollbar-thumb {
      background: rgba(200,148,14,0.4);
      border-radius: 2px;
    }

    /* ── ARC SECTIONS ─────────────────────────── */
    .arc-section {
      margin-bottom: 48px;
    }

    .arc-section:last-child {
      margin-bottom: 0;
    }

    .arc-hdr {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
      padding: 10px 0 8px;
    }

    .arc-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(200,148,14,0.2) 0%, transparent 100%);
    }

    .arc-line.r {
      background: linear-gradient(270deg, rgba(200,148,14,0.2) 0%, transparent 100%);
    }

    .arc-name {
      font-family: var(--fc);
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 3px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .arc-count {
      font-size: 11px;
      color: var(--text3);
      margin-right: 6px;
    }

    /* ── EPISODE GRID ─────────────────────────── */
    .arc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      direction: rtl;
      contain: layout style;
    }

    /* ── EPISODE CARD ─────────────────────────── */
    .epc {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      outline: none;
      transition: transform 0.22s cubic-bezier(0.34,1.3,0.64,1), border-color 0.22s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      will-change: transform;
    }

    .epc::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.04) 0%, transparent 50%);
    }

    .epc:hover {
      transform: scale(1.04) translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.7);
      border-color: rgba(200,148,14,0.45);
      z-index: 3;
    }

    .epc:focus, .epc.fx {
      transform: scale(1.06) translateY(-4px);
      box-shadow: 0 0 0 2px var(--gold2), 0 12px 32px rgba(0,0,0,0.8);
      border-color: var(--gold2);
      z-index: 5;
    }

    /* Watched checkmark */
    .epc.wt::after {
      content: '✓';
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 10;
      background: var(--gold2);
      color: var(--ink);
      font-size: 10px;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    /* No source */
    .epc.ns {
      opacity: .45;
      filter: grayscale(.5);
    }

    /* Currently watching */
    @keyframes borderPulse {
      0%, 100% { border-color: rgba(200,148,14,0.6) }
      50%       { border-color: rgba(240,192,48,1) }
    }

    .epc.has-resume {
      border: 2px solid var(--gold);
      animation: borderPulse 2.5s ease-in-out infinite;
    }

    .epc.has-resume .ep-post::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(to left, rgba(200,148,14,0.25) 0%, transparent 55%);
    }

    .ep-resume-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(0,0,0,0.3);
      z-index: 4;
    }

    .ep-resume-fill {
      height: 100%;
      background: var(--gold2);
      border-radius: 0 2px 2px 0;
      min-width: 3px;
    }

    /* ── CARD POSTER ──────────────────────────── */
    .ep-post {
      position: relative;
      height: 120px;
      overflow: hidden;
      background: linear-gradient(160deg, #0b1628 0%, #0e2040 55%, #0a1830 100%);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ep-post::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to top, rgba(17,25,39,0.8), transparent);
      pointer-events: none;
      z-index: 1;
    }

    .ep-n {
      font-family: var(--ft);
      font-size: var(--fs-card-n);
      font-weight: 700;
      color: var(--gold2);
      text-shadow: 0 0 20px rgba(240,192,48,0.4);
      letter-spacing: 1px;
      line-height: 1;
      position: relative;
      z-index: 2;
    }

    /* ── CARD INFO ────────────────────────────── */
    .ep-info {
      position: relative;
      z-index: 1;
      background: rgba(6,10,20,0.6);
      padding: 10px 11px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ep-w {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--gold2);
      text-align: center;
      border: 1px solid rgba(200,148,14,0.45);
      border-radius: 3px;
      padding: 2px 7px;
      display: inline-block;
      align-self: center;
      font-family: var(--fc);
    }

    .ep-t {
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      text-align: center;
      font-family: var(--fi);
      line-height: 1.4;
      word-break: break-word;
    }

    .ep-nl {
      font-size: var(--fs-card-s);
      color: var(--text2);
      text-align: center;
      opacity: 0.8;
    }

    /* ── PLAYER SCREEN ────────────────────────── */
    #player-screen {
      background: #000;
    }

    #vid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
      cursor: none;
      object-fit: contain;
    }

    #vid::-webkit-media-controls {
      display: none !important;
    }

    /* Loading */
    #vid-loading {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: radial-gradient(ellipse at center, #0e2040 0%, var(--bg) 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      pointer-events: none;
    }

    #vid-loading.on {
      display: flex;
    }

    .lspin {
      font-size: 80px;
      animation: jp 2s ease-in-out infinite;
      filter: drop-shadow(0 0 22px var(--gold));
    }

    .lbw {
      width: 300px;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .lb {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      animation: lba 2s ease-in-out infinite;
    }

    @keyframes lba {
      0%   { width: 0%;   opacity: 1 }
      70%  { width: 100%; opacity: 1 }
      100% { width: 100%; opacity: 0 }
    }

    #lmsg {
      font-size: var(--fs-ui);
      color: var(--gold);
      letter-spacing: 2px;
    }

    /* Error */
    #vid-error {
      position: absolute;
      inset: 0;
      z-index: 16;
      background: radial-gradient(ellipse at center, #0e2040 0%, var(--bg) 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 60px;
    }

    #vid-error.on {
      display: flex;
    }

    .ei { font-size: 80px }

    .et {
      font-family: var(--ft);
      font-size: var(--fs-title);
      color: var(--gold2);
    }

    .ed {
      font-size: var(--fs-ui);
      color: var(--text2);
      max-width: 500px;
      line-height: 1.6;
    }

    .eacts {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    .ebtn {
      background: linear-gradient(135deg, var(--gold) 0%, #7a5005 100%);
      border: 1px solid var(--gold2);
      border-radius: 10px;
      color: var(--ink);
      font-size: var(--fs-ui);
      font-weight: bold;
      font-family: var(--fu);
      padding: 12px 24px;
      cursor: pointer;
      outline: none;
      transition: transform var(--tr), box-shadow var(--tr);
    }

    .ebtn.sec {
      background: rgba(12,18,32,0.95);
      color: var(--gold2);
      border-color: rgba(255,255,255,0.12);
    }

    .ebtn:hover, .ebtn:focus {
      box-shadow: var(--focus);
      transform: scale(1.05);
    }

    /* ── PLAYER TOP BAR ───────────────────────── */
    #player-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 20px 44px 48px;
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    #player-top.on {
      opacity: 1;
      pointer-events: auto;
    }

    .top-btn {
      background: rgba(6,8,14,0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      font-family: var(--fu);
      padding: 8px 18px;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
      transition: all var(--tr);
    }

    .top-btn:focus, .top-btn:hover {
      background: rgba(200,148,14,0.15);
      border-color: rgba(200,148,14,0.4);
      color: var(--gold2);
    }

    #top-title {
      flex: 1;
      text-align: center;
      font-family: var(--ft);
      font-size: 20px;
      color: var(--text);
      text-shadow: 1px 1px 8px #000;
    }

    /* ── PLAYER HUD ───────────────────────────── */
    #player-hud {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
      padding: 16px 44px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    #player-hud.on {
      opacity: 1;
      pointer-events: auto;
    }

    /* Progress bar */
    #prog-wrap {
      position: relative;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      cursor: pointer;
      transform-origin: bottom;
      transition: transform .15s;
      will-change: transform;
    }

    #prog-wrap:hover, #prog-wrap.fx {
      transform: scaleY(1.4);
    }

    #prog-buf {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(255,255,255,0.22);
      border-radius: 4px;
      pointer-events: none;
    }

    #prog-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(to right, var(--gold) 0%, var(--gold2) 100%);
      border-radius: 4px;
      pointer-events: none;
    }

    #prog-thumb {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      background: var(--gold2);
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 8px rgba(240,192,48,0.6);
      opacity: 0;
      transition: opacity .15s;
    }

    #prog-wrap:hover #prog-thumb, #prog-wrap.fx #prog-thumb {
      opacity: 1;
    }

    /* Progress tooltip */
    #prog-tip {
      position: absolute;
      bottom: calc(100% + 10px);
      transform: translateX(-50%);
      background: rgba(6,8,14,0.92);
      border: 1px solid rgba(200,148,14,0.45);
      border-radius: 6px;
      color: var(--gold2);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-family: var(--fu);
      padding: 4px 10px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .12s;
      z-index: 5;
    }

    #prog-wrap:hover #prog-tip {
      opacity: 1;
    }

    /* Controls row */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.75);
      font-size: var(--fs-ctrl);
      cursor: pointer;
      outline: none;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--tr), transform var(--tr);
      flex-shrink: 0;
    }

    .ctrl-btn:focus, .ctrl-btn:hover, .ctrl-btn.fx {
      color: var(--gold2);
      transform: scale(1.15);
    }

    .ctrl-btn.big {
      font-size: 32px;
      width: 54px;
      height: 54px;
    }

    .time-disp {
      color: var(--text2);
      font-size: var(--fs-hud);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      min-width: 50px;
    }

    .ep-hud-info {
      flex: 1;
      text-align: center;
    }

    .ep-hud-title {
      font-family: var(--ft);
      font-size: 18px;
      color: var(--text);
      text-shadow: 1px 1px 5px #000;
      line-height: 1.3;
    }

    .ep-hud-num {
      font-size: var(--fs-sm);
      color: var(--text2);
      margin-top: 2px;
    }

    /* Volume */
    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .vol-icon {
      font-size: 20px;
      color: var(--text2);
      cursor: pointer;
    }

    .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold2);
      cursor: pointer;
    }

    #btn-spd {
      font-size: var(--fs-sm);
      font-weight: bold;
      width: auto;
      min-width: 44px;
      padding: 0 10px;
      letter-spacing: .5px;
    }

    /* ── AUTO-NEXT ────────────────────────────── */
    #autonext {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(6,10,20,0.97);
      border: 1px solid rgba(200,148,14,0.4);
      border-radius: 14px;
      padding: 18px 28px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-size: var(--fs-ui);
      min-width: 300px;
      text-align: center;
    }

    #autonext.on {
      display: flex;
    }

    #an-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      overflow: hidden;
    }

    #an-bar {
      height: 100%;
      width: 100%;
      background: var(--gold2);
      border-radius: 3px;
      transition: width linear;
    }

    .an-btns {
      display: flex;
      gap: 12px;
    }

    .an-btn {
      background: transparent;
      border: 1px solid rgba(200,148,14,0.4);
      border-radius: 8px;
      color: var(--gold2);
      font-size: var(--fs-ui);
      padding: 8px 20px;
      cursor: pointer;
      outline: none;
      transition: all var(--tr);
    }

    .an-btn:hover, .an-btn:focus {
      background: rgba(200,148,14,0.12);
      border-color: var(--gold);
    }

    .an-btn.pri {
      background: var(--gold);
      color: var(--ink);
      font-weight: bold;
      border-color: var(--gold);
    }

    /* ── WATCHDOG ─────────────────────────────── */
    #watchdog {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(6,8,14,0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 60px;
    }

    #watchdog.on {
      display: flex;
    }

    .wd-skull {
      font-size: 90px;
      filter: drop-shadow(0 0 24px var(--gold));
      animation: jp 2s ease-in-out infinite;
    }

    .wd-title {
      font-family: var(--ft);
      font-size: var(--fs-title);
      color: var(--gold2);
    }

    .wd-desc {
      font-size: var(--fs-ui);
      color: var(--text2);
      max-width: 480px;
      line-height: 1.7;
    }

    .wd-timer {
      font-size: 80px;
      font-family: var(--ft);
      color: var(--gold2);
      font-weight: bold;
      text-shadow: 0 0 30px rgba(240,192,48,0.55);
      line-height: 1;
    }

    .wd-btn {
      background: linear-gradient(135deg, var(--gold) 0%, #7a5005 100%);
      border: 1px solid var(--gold2);
      border-radius: 12px;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      font-family: var(--fu);
      padding: 16px 40px;
      cursor: pointer;
      outline: none;
      transition: transform var(--tr), box-shadow var(--tr);
    }

    .wd-btn:hover, .wd-btn:focus {
      box-shadow: var(--focus);
      transform: scale(1.07);
    }

    /* ── APP LOADING ──────────────────────────── */
    #apl {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #apl .alj {
      font-size: 90px;
      animation: jp 3s ease-in-out infinite;
      filter: drop-shadow(0 0 22px var(--gold));
    }

    #apl p {
      color: var(--gold);
      font-size: 22px;
      letter-spacing: 4px;
      font-family: var(--ft);
    }

    /* ── SCROLLBARS ───────────────────────────── */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(200,148,14,0.4);
      border-radius: 2px;
    }

    /* ── SEARCH BAR ──────────────────────────── */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 8px 20px;
      transition: border-color var(--tr), background var(--tr);
      flex: 1;
      max-width: 440px;
      margin: 0 24px;
    }

    .search-wrap:focus-within {
      border-color: rgba(200,148,14,0.55);
      background: rgba(200,148,14,0.05);
    }

    .search-icon { font-size: 16px; opacity: 0.45; flex-shrink: 0; }

    #ep-search {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: var(--fs-ui);
      font-family: var(--fu);
      width: 100%;
      direction: rtl;
    }

    #ep-search::placeholder { color: var(--text3); }

    .search-clear {
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 15px;
      opacity: 0;
      padding: 0;
      transition: opacity var(--tr);
      flex-shrink: 0;
      line-height: 1;
    }

    .search-wrap.has-text .search-clear { opacity: 1; }

    .no-results {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 80px 0;
      color: var(--text2);
      font-size: var(--fs-ui);
    }

    .no-results .nr-icon { font-size: 52px; opacity: 0.35; }

    /* ── NUMBER DIAL OVERLAY ──────────────────── */
    #dial-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 60;
      background: rgba(6,8,14,0.96);
      border: 2px solid rgba(200,148,14,0.55);
      border-radius: 20px;
      padding: 28px 52px 24px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 280px;
    }

    #dial-overlay.on { display: flex; }

    .dial-label {
      font-size: var(--fs-sm);
      color: var(--text2);
      letter-spacing: 2px;
    }

    #dial-number {
      font-family: var(--ft);
      font-size: 74px;
      font-weight: 900;
      color: var(--gold2);
      letter-spacing: 6px;
      line-height: 1;
      min-height: 84px;
      text-shadow: 0 0 30px rgba(240,192,48,0.4);
    }

    #dial-hint {
      font-size: var(--fs-sm);
      color: var(--text2);
      min-height: 18px;
      max-width: 240px;
      line-height: 1.4;
    }

    /* ── CARD ENTRANCE ────────────────────────── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px) }
      to   { opacity: 1; transform: translateY(0) }
    }

    .arc-grid .epc { animation: fadeInUp 0.25s ease both }

    function getWatched() { try { return JSON.parse(localStorage.getItem(LS.W) || '[]'); } catch { return []; } }
    function markWatched(n) {
      const w = getWatched();
      if (!w.includes(n)) { w.push(n); localStorage.setItem(LS.W, JSON.stringify(w)); }
      localStorage.setItem(LS.L, n);
    }
    function getLastEp() { return parseInt(localStorage.getItem(LS.L) || '0', 10); }
    function savePos(n, t, dur) { if (t > 5 && dur > 0) { localStorage.setItem(LS.pos(n), t.toFixed(1)); localStorage.setItem(LS.dur(n), dur.toFixed(1)); } }

    /* ══════════════════════════════════════════════
       HELPERS
       ══════════════════════════════════════════════ */
    function findEp(n) {
      for (const s of DATA.sagas) for (const a of s.arcs) { const e = a.eps.find(x => x.n === n); if (e) return e; }
      return null;
    }
    function findNext(n) {
      let f = false;
      for (const s of DATA.sagas) for (const a of s.arcs) for (const e of a.eps) { if (f) return e; if (e.n === n) f = true; }
      return null;
    }
    function findPrev(n) {
      let prev = null;
      for (const s of DATA.sagas) for (const a of s.arcs) for (const e of a.eps) { if (e.n === n) return prev; prev = e; }
      return null;
    }
    function fmt(s) { if (!isFinite(s) || s < 0) return '0:00'; const m = Math.floor(s / 60), sc = Math.floor(s % 60); return m + ':' + (sc < 10 ? '0' : '') + sc; }

    /* ══════════════════════════════════════════════
       RESUME BUTTON
       ══════════════════════════════════════════════ */
    function updResume() {
      const last = getLastEp(); if (!last) { BR.classList.remove('on'); return; }
      const pos = getPos(last);
      let target = (pos.t > 5 && pos.dur > 0) ? findEp(last) : findNext(last);
      if (!target) target = findNext(last) || findEp(last);
      if (!target) { BR.classList.remove('on'); return; }
      const label = (pos.t > 30 && pos.dur > 0 && target.n === last)
        ? 'המשך פרק ' + target.n + ' (' + fmt(pos.t) + ')'
        : 'פרק ' + target.n;
      RELBL.textContent = label;
      BR.classList.add('on');
      BR._ep = target;
    }
    BR.addEventListener('click', () => { if (BR._ep) openEp(BR._ep.n); });

    /* ══════════════════════════════════════════════
       RENDER MAIN SCREEN
       ══════════════════════════════════════════════ */
    function renderSagas() {
      const f = document.createDocumentFragment();
      DATA.sagas.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = 'saga-tab focusable' + (i === ST.saga ? ' ac' : '');
        b.textContent = s.name; b.dataset.type = 'saga'; b.dataset.idx = i;
        b.setAttribute('role', 'tab'); b.tabIndex = 0; f.appendChild(b);
      });
      SNAV.innerHTML = ''; SNAV.appendChild(f);
    }

    function buildCard(ep, watched) {
      const hasUrl = !!EP[ep.n];
      const pos = getPos(ep.n);
      const hasR = pos.t > 30 && pos.dur > 0;
      const pct = hasR ? Math.min(100, (pos.t / pos.dur) * 100) : 0;
      const c = document.createElement('div');
      c.className = 'epc focusable'
        + (watched.includes(ep.n) ? ' wt' : '')
        + (hasUrl ? '' : ' ns')
        + (hasR ? ' has-resume' : '');
      c.dataset.type = 'episode'; c.dataset.epn = ep.n;
      c.setAttribute('role', 'listitem'); c.tabIndex = 0;
      const epost = document.createElement('div'); epost.className = 'ep-post';
      const epnsp = document.createElement('span'); epnsp.className = 'ep-n'; epnsp.textContent = ep.n;
      const rbar = document.createElement('div'); rbar.className = 'ep-resume-bar';
      const rfill = document.createElement('div'); rfill.className = 'ep-resume-fill'; rfill.style.width = pct + '%';
      rbar.appendChild(rfill); epost.append(epnsp, rbar);
      const einfo = document.createElement('div'); einfo.className = 'ep-info';
      const ewanted = document.createElement('span'); ewanted.className = 'ep-w'; ewanted.textContent = 'WANTED';
      const etitle = document.createElement('div'); etitle.className = 'ep-t'; etitle.textContent = ep.nm;
      const enuml = document.createElement('div'); enuml.className = 'ep-nl'; enuml.textContent = 'פרק ' + ep.n + (hasR ? ' · ' + fmt(pos.t) : '');
      einfo.append(ewanted, etitle, enuml); c.append(epost, einfo);
      return c;
    }

    function renderEps() {
      const saga = DATA.sagas[ST.saga];
      const watched = getWatched();
      const frag = document.createDocumentFragment();
      saga.arcs.forEach(arc => {
        const section = document.createElement('div'); section.className = 'arc-section';
        const hdr = document.createElement('div'); hdr.className = 'arc-hdr';
        const aln1 = document.createElement('div'); aln1.className = 'arc-line';
        const ans = document.createElement('span'); ans.className = 'arc-name'; ans.textContent = arc.name;
        const acs = document.createElement('span'); acs.className = 'arc-count'; acs.textContent = arc.eps.length + ' פרקים';
        const aln2 = document.createElement('div'); aln2.className = 'arc-line r';
        hdr.append(aln1, ans, acs, aln2); section.appendChild(hdr);
        const grid = document.createElement('div'); grid.className = 'arc-grid';
        arc.eps.forEach(ep => grid.appendChild(buildCard(ep, watched)));
        section.appendChild(grid); frag.appendChild(section);
      });
      EPCONT.innerHTML = ''; EPCONT.appendChild(frag);
      requestAnimationFrame(() => { const x = EPCONT.querySelector('.epc'); if (x) setFx(x); });
    }

    function renderSearch(q) {
      const ql = q.toLowerCase();
      const watched = getWatched();
      const matches = [];
      for (const s of DATA.sagas)
        for (const a of s.arcs)
          for (const ep of a.eps)
            if (String(ep.n).includes(q) || ep.nm.toLowerCase().includes(ql)) matches.push(ep);
      const frag = document.createDocumentFragment();
      if (!matches.length) {
        const nr = document.createElement('div'); nr.className = 'no-results';
        nr.innerHTML = '<div class="nr-icon">🔍</div><div>לא נמצאו תוצאות עבור &quot;' + q + '&quot;</div>';
        frag.appendChild(nr);
      } else {
        const lbl = document.createElement('div');
        lbl.style.cssText = 'padding:0 0 16px;color:var(--text2);font-size:var(--fs-sm)';
        lbl.textContent = matches.length + ' תוצאות';
        frag.appendChild(lbl);
        const grid = document.createElement('div'); grid.className = 'arc-grid';
        matches.forEach(ep => grid.appendChild(buildCard(ep, watched)));
        frag.appendChild(grid);
      }
      EPCONT.innerHTML = ''; EPCONT.appendChild(frag);
      requestAnimationFrame(() => { const x = EPCONT.querySelector('.epc'); if (x) setFx(x); });
    }

    function applySearch(q) {
      ST.search = q;
      SEARCHWRAP.classList.toggle('has-text', !!q);
      q ? renderSearch(q) : renderEps();
    }

    function clearSearch() { SEARCHINPUT.value = ''; applySearch(''); }

    SEARCHINPUT.addEventListener('input', () => applySearch(SEARCHINPUT.value.trim()));
    SEARCHCLEAR.addEventListener('click', () => { clearSearch(); SEARCHINPUT.focus(); });

    /* ══════════════════════════════════════════════
       FOCUS & SPATIAL NAV
       ══════════════════════════════════════════════ */
    function setFx(el) {
      if (ST.focused) ST.focused.classList.remove('fx');
      ST.focused = el; if (!el) return;
      el.classList.add('fx'); el.focus({ preventScroll: false });
      el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    function nbr(cur, dir) {
      const all = [...document.querySelectorAll('#main-screen .focusable')];
      if (!cur || !all.length) return null;
      const r0 = cur.getBoundingClientRect();
      const cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
      let best = null, bs = Infinity;
      for (const el of all) {
        if (el === cur) continue;
        const r = el.getBoundingClientRect();
        const ex = r.left + r.width / 2, ey = r.top + r.height / 2;
        const dx = ex - cx, dy = ey - cy;
        const ok = (dir === 'right' && dx < -5) || (dir === 'left' && dx > 5) || (dir === 'down' && dy > 5) || (dir === 'up' && dy < -5);
        if (!ok) continue;
        const d = Math.sqrt(dx * dx + dy * dy), pen = (dir === 'right' || dir === 'left') ? Math.abs(dy) * 2 : Math.abs(dx) * 2;
        const sc = d + pen; if (sc < bs) { bs = sc; best = el; }
      }
      return best;
    }

    /* ══════════════════════════════════════════════
       EVENT DELEGATION
       ══════════════════════════════════════════════ */
    const DM = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' };
    /* ── NUMBER DIAL ─────────────────────────── */
    let _dialStr = '', _dialTimer = null;
    function dialDigit(d) {
      _dialStr += d;
      DIALNUMBER.textContent = _dialStr;
      const ep = findEp(+_dialStr);
      DIALHINT.textContent = ep ? ep.nm : (+_dialStr > 1000 ? 'מספר לא חוקי' : '...');
      DIALOVERLAY.classList.add('on');
      clearTimeout(_dialTimer);
      _dialTimer = setTimeout(() => {
        const n = +_dialStr; _dialStr = '';
        DIALOVERLAY.classList.remove('on');
        const target = findEp(n);
        if (target) { openEp(n); }
        else {
          DIALNUMBER.textContent = n; DIALHINT.textContent = 'פרק לא קיים';
          DIALOVERLAY.classList.add('on');
          setTimeout(() => DIALOVERLAY.classList.remove('on'), 1400);
        }
      }, 1500);
    }

    document.addEventListener('keydown', e => {
      resetAct();
      if (PS.classList.contains('active')) { handlePKeys(e); return; }

      // Back / GoBack keys
      if (e.key === 'Backspace' || e.key === 'GoBack' || e.key === 'BrowserBack' || e.key === 'XF86Back') {
        e.preventDefault();
        // If dial is open — clear it
        if (DIALOVERLAY.classList.contains('on')) {
          clearTimeout(_dialTimer); _dialStr = ''; DIALOVERLAY.classList.remove('on'); return;
        }
        // If search is active — clear search
        if (ST.search) { clearSearch(); return; }
        // Navigate back in saga history
        if (ST.navHistory.length > 0) {
          const prev = ST.navHistory.pop();
          ST.saga = prev.saga;
          document.querySelectorAll('.saga-tab').forEach((t, j) => t.classList.toggle('ac', j === ST.saga));
          renderEps();
        }
        return;
      }

      // Number dial — digits typed while not in search input
      if (/^\d$/.test(e.key) && document.activeElement !== SEARCHINPUT && !e.ctrlKey && !e.altKey) {
        e.preventDefault(); dialDigit(e.key); return;
      }

      if (DM[e.key]) { e.preventDefault(); const n = nbr(ST.focused, DM[e.key]); if (n) setFx(n); return; }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (ST.focused) activEl(ST.focused); }
    });
    document.addEventListener('mouseenter', e => {
      resetAct();
      const el = e.target.closest('.focusable');
      if (el && MS.classList.contains('active')) setFx(el);
    }, true);
    document.addEventListener('click', e => {
      resetAct();
      const el = e.target.closest('.focusable');
      if (el && MS.classList.contains('active')) activEl(el);
    }, true);
    let _rafMM = false;
    document.addEventListener('mousemove', () => { if (_rafMM) return; _rafMM = true; requestAnimationFrame(() => { resetAct(); _rafMM = false; }); });

    function activEl(el) {
      const t = el.dataset.type;
      if (t === 'saga') selSaga(+el.dataset.idx);
      else if (t === 'episode') openEp(+el.dataset.epn);
      else if (el === BR && BR._ep) openEp(BR._ep.n);
    }
    function selSaga(i) {
      if (i !== ST.saga) ST.navHistory.push({ saga: ST.saga });
      ST.saga = i;
      document.querySelectorAll('.saga-tab').forEach((t, j) => t.classList.toggle('ac', j === i));
      clearSearch();
      renderEps();
    }

    /* ══════════════════════════════════════════════
       OPEN EPISODE
       ══════════════════════════════════════════════ */
    function openEp(n, useBackup = false) {
      cancelAN();
      const ep = findEp(n); if (!ep) return;
      ST.usingBackup = useBackup;
      const url = getEpUrl(n, useBackup);
      ST.ep = ep;
      markWatched(n); updResume();
      MS.classList.remove('active'); PS.classList.add('active');
      clearTimeout(_dialTimer); _dialStr = ''; DIALOVERLAY.classList.remove('on');
      TOPTTL.textContent = 'פרק ' + ep.n + ' — ' + ep.nm;
      HUDT.textContent = ep.nm; HUDN.textContent = 'פרק ' + ep.n;
      VERR.classList.remove('on'); VLOAD.classList.add('on');
      LMSG.textContent = 'טוען וידאו...';
      VID.src = ''; BPLAY.textContent = '▶'; resetProg(); ST._lastSec = -1;
      clearInterval(ST.saveIv);
      if (!url) { showErr('פרק אינו זמין', 'הפרק לא נמצא במסד הנתונים'); return; }
      const saved = getPos(n);
      VID._seek = saved.t > 10 ? saved.t : 0;
      VID.src = url; VID.load();
      startWD();
    }

    /* ══════════════════════════════════════════════
       VIDEO EVENTS
       ══════════════════════════════════════════════ */
    VID.addEventListener('loadedmetadata', () => {
      TDUR.textContent = fmt(VID.duration);
      if (VID._seek > 0) {
        VID.currentTime = VID._seek; VID._seek = 0;
        LMSG.textContent = 'ממשיך מ-' + fmt(VID.currentTime) + '...';
      }
    });
    VID.addEventListener('canplay', () => {
      VLOAD.classList.remove('on');
      restoreSpeed();
      VID.play().catch(() => { });
      showHud(); schedHud(); showTop();
      clearInterval(ST.saveIv);
      ST.saveIv = setInterval(() => { if (ST.ep) savePos(ST.ep.n, VID.currentTime, VID.duration); }, 5000);
    });
    VID.addEventListener('playing', () => { BPLAY.textContent = '⏸'; VLOAD.classList.remove('on'); });
    VID.addEventListener('pause', () => { BPLAY.textContent = '▶'; if (ST.ep) savePos(ST.ep.n, VID.currentTime, VID.duration); });
    VID.addEventListener('waiting', () => { VLOAD.classList.add('on'); LMSG.textContent = 'מאגר...'; });
    VID.addEventListener('timeupdate', () => {
      if (ST.seeking) return;
      const t = VID.currentTime, dur = VID.duration || 1, pct = (t / dur) * 100;
      PROGFILL.style.width = pct + '%'; PROGTHUMB.style.left = pct + '%';
      const sec = t | 0;
      if (sec !== ST._lastSec) {
        ST._lastSec = sec;
        TCUR.textContent = fmt(t);
        if (VID.buffered.length > 0) {
          PROGBUF.style.width = ((VID.buffered.end(VID.buffered.length - 1) / dur) * 100) + '%';
        }
      }
    });
    VID.addEventListener('ended', () => {
      BPLAY.textContent = '▶'; clearInterval(ST.saveIv);
      if (ST.ep) { clearPos(ST.ep.n); markWatched(ST.ep.n); }
      schedAN();
    });
    VID.addEventListener('error', () => {
      // אם עדיין לא ניסינו מפתח רזרבי — ננסה אותו אוטומטית
      if (!ST.usingBackup && API_KEY_FALLBACK && ST.ep) {
        openEp(ST.ep.n, true);
        return;
      }
      const ec = VID.error?.code || 0;
      const msgs = { 1: 'הטעינה בוטלה', 2: 'שגיאת רשת — בדוק חיבור', 3: 'שגיאת פענוח', 4: 'פורמט לא נתמך' };
      showErr('שגיאה בטעינת הוידאו', msgs[ec] || 'קוד שגיאה: ' + ec + '. נסה שוב.');
    });
    VID.addEventListener('click', () => { resetAct(); VID.paused || VID.ended ? VID.play().catch(() => {}) : VID.pause(); showHud(); schedHud(); });

    /* ══════════════════════════════════════════════
       PROGRESS BAR
       ══════════════════════════════════════════════ */
    function seekTo(e) {
      const rect = PROGWRAP.getBoundingClientRect();
      const x = (e.clientX ?? e.touches?.[0]?.clientX ?? 0);
      const pct = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
      const dur = VID.duration || 0;
      if (dur > 0) { VID.currentTime = pct * dur; PROGFILL.style.width = (pct * 100) + '%'; PROGTHUMB.style.left = (pct * 100) + '%'; TCUR.textContent = fmt(pct * dur); }
    }
    PROGWRAP.addEventListener('mousedown', e => {
      ST.seeking = true; seekTo(e);
      const up = () => { ST.seeking = false; document.removeEventListener('mouseup', up); document.removeEventListener('mousemove', mv); };
      const mv = e2 => seekTo(e2);
      document.addEventListener('mouseup', up); document.addEventListener('mousemove', mv);
    });
    PROGWRAP.addEventListener('click', seekTo);
    PROGWRAP.addEventListener('keydown', e => {
      const step = e.shiftKey ? 30 : 10;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        VID.currentTime = Math.max(0, Math.min(VID.duration || 0, VID.currentTime + (e.key === 'ArrowLeft' ? step : -step)));
      }
    });
    PROGWRAP.addEventListener('mousemove', e => {
      const rect = PROGWRAP.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const dur = VID.duration || 0;
      PROGTIP.textContent = fmt(pct * dur);
      PROGTIP.style.left = (pct * 100) + '%';
    });
    function resetProg() { PROGFILL.style.width = '0%'; PROGBUF.style.width = '0%'; PROGTHUMB.style.left = '0%'; TCUR.textContent = '0:00'; TDUR.textContent = '0:00'; }

    /* ══════════════════════════════════════════════
       HUD VISIBILITY
       ══════════════════════════════════════════════ */
    function showHud() { PHUD.classList.add('on'); ST.hudOn = true; VID.style.cursor = 'default'; }
    function hideHud() { PHUD.classList.remove('on'); ST.hudOn = false; VID.style.cursor = 'none'; }
    function schedHud() { clearTimeout(ST.hudTimer); ST.hudTimer = setTimeout(hideHud, 1000); }
    function togHud() { if (ST.hudOn) { hideHud(); clearTimeout(ST.hudTimer); } else { showHud(); schedHud(); } }
    function showTop() { PTOP.classList.add('on'); clearTimeout(ST.topTimer); ST.topTimer = setTimeout(() => PTOP.classList.remove('on'), 3000); }

    let _rafPS = false;
    PS.addEventListener('mousemove', () => { if (_rafPS) return; _rafPS = true; requestAnimationFrame(() => { resetAct(); showHud(); schedHud(); showTop(); _rafPS = false; }); });
    PHUD.addEventListener('mouseenter', () => { clearTimeout(ST.hudTimer); showHud(); });
    PHUD.addEventListener('mouseleave', schedHud);
    PTOP.addEventListener('mouseenter', e => { const b = e.target.closest('.top-btn'); if (b) b.focus(); }, true);
    PHUD.addEventListener('mouseenter', e => { const b = e.target.closest('.ctrl-btn,.vol-slider,#prog-wrap'); if (b) b.focus(); }, true);

    /* ══════════════════════════════════════════════
       PLAYER CONTROLS
       ══════════════════════════════════════════════ */
    BPLAY.addEventListener('click', () => { resetAct(); VID.paused || VID.ended ? VID.play().catch(() => { }) : VID.pause(); });
    BRW.addEventListener('click', () => { resetAct(); VID.currentTime = Math.max(0, VID.currentTime - 10); });
    BFW.addEventListener('click', () => { resetAct(); VID.currentTime = Math.min(VID.duration || 0, VID.currentTime + 10); });

    function setVol(v) { VID.volume = Math.max(0, Math.min(1, v)); BVOL.value = VID.volume; VICO.textContent = VID.muted || VID.volume === 0 ? '🔇' : VID.volume < 0.5 ? '🔉' : '🔊'; localStorage.setItem(LS.V, VID.volume); }
    BVOL.addEventListener('input', () => setVol(parseFloat(BVOL.value)));

    const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
    function cycleSpeed() {
      const idx = SPEEDS.indexOf(VID.playbackRate);
      const next = SPEEDS[(idx + 1) % SPEEDS.length];
      VID.playbackRate = next;
      BSPD.textContent = next + '×';
      localStorage.setItem(LS.SPD, next);
    }
    function restoreSpeed() {
      const spd = parseFloat(localStorage.getItem(LS.SPD) || '1');
      VID.playbackRate = SPEEDS.includes(spd) ? spd : 1;
      BSPD.textContent = VID.playbackRate + '×';
    }
    BSPD.addEventListener('click', () => { resetAct(); cycleSpeed(); });

    /* ══════════════════════════════════════════════
       BACK / NEXT
       ══════════════════════════════════════════════ */
    function goBack() {
      cancelAN(); stopWD(); clearInterval(ST.saveIv);
      if (ST.ep && VID.currentTime > 5) savePos(ST.ep.n, VID.currentTime, VID.duration);
      VID.pause(); VID.src = '';
      VERR.classList.remove('on'); VLOAD.classList.remove('on');
      hideHud(); PTOP.classList.remove('on');
      PS.classList.remove('active'); MS.classList.add('active');
      updResume(); renderEps();
      requestAnimationFrame(() => { const el = EPCONT.querySelector('.epc.fx') || EPCONT.querySelector('.epc') || BR; if (el) setFx(el); });
    }
    function goNext() { if (ST.ep) { const nx = findNext(ST.ep.n); if (nx) openEp(nx.n); } }
    function goPrev() { if (ST.ep) { const pv = findPrev(ST.ep.n); if (pv) openEp(pv.n); } }
    BBACK.addEventListener('click', goBack); BEBACK.addEventListener('click', goBack);
    BNEXT.addEventListener('click', goNext); BENEXT.addEventListener('click', goNext);
    BPREV.addEventListener('click', goPrev);
    BRETRY.addEventListener('click', () => { if (ST.ep) openEp(ST.ep.n); });
    function showErr(t, d) { VLOAD.classList.remove('on'); $('et-title').textContent = t; $('et-desc').textContent = d; VERR.classList.add('on'); requestAnimationFrame(() => BRETRY.focus()); }

    /* ══════════════════════════════════════════════
       PLAYER KEY HANDLER
       ══════════════════════════════════════════════ */
    function handlePKeys(e) {
      resetAct();
      if (WD.classList.contains('on')) { if (e.key === 'Enter' || e.key === ' ') dimWD(); return; }
      const isErr = VERR.classList.contains('on');
      if (isErr) {
        if (e.key === 'Backspace') { goBack(); return; }
        const sc = [...VERR.querySelectorAll('.focusable')], idx = sc.indexOf(document.activeElement);
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); (sc[idx + 1] || sc[0]).focus(); }
        else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); (sc[idx - 1] || sc[sc.length - 1]).focus(); }
        return;
      }
      switch (e.key) {
        case 'Backspace': case 'Escape': case 'GoBack': case 'BrowserBack': case 'XF86Back': goBack(); return;
        case 'Enter': case ' ':
        case 'MediaPlayPause': case 'MediaPlay': case 'MediaPause':
          e.preventDefault();
          if (e.key === 'MediaPause') { VID.pause(); showHud(); schedHud(); return; }
          if (e.key === 'MediaPlay')  { VID.play().catch(() => {}); showHud(); schedHud(); return; }
          if (document.activeElement?.closest('#player-top,#player-hud,#autonext')) return;
          VID.paused || VID.ended ? VID.play().catch(() => { }) : VID.pause();
          showHud(); schedHud(); return;
        // RTL: Right arrow = rewind, Left = forward; Shift = 30s jump
        case 'ArrowLeft':
          e.preventDefault();
          VID.currentTime = Math.min(VID.duration || 0, VID.currentTime + (e.shiftKey ? 30 : 10));
          showHud(); schedHud(); return;
        case 'ArrowRight':
          e.preventDefault();
          VID.currentTime = Math.max(0, VID.currentTime - (e.shiftKey ? 30 : 10));
          showHud(); schedHud(); return;
        case 'ArrowUp':
          e.preventDefault();
          setVol(VID.volume + 0.1);
          showHud(); schedHud(); return;
        case 'ArrowDown':
          e.preventDefault();
          setVol(VID.volume - 0.1);
          showHud(); schedHud(); return;
        case 'm': case 'M':
          e.preventDefault();
          VID.muted = !VID.muted; VICO.textContent = VID.muted ? '🔇' : VID.volume < 0.5 ? '🔉' : '🔊';
          showHud(); schedHud(); return;

        case 's': case 'S':
          e.preventDefault();
          cycleSpeed(); showHud(); schedHud(); return;
      }
    }

    /* ══════════════════════════════════════════════
       AUTO-NEXT
       ══════════════════════════════════════════════ */
    function schedAN() {
      cancelAN(); if (!ST.ep) return;
      const nx = findNext(ST.ep.n); if (!nx) return;
      ST.anEp = nx; const secs = 8;
      ANTXT.textContent = 'עובר לפרק ' + nx.n + ' — ' + nx.nm;
      ANBAR.style.transition = 'none'; ANBAR.style.width = '100%';
      AN.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => { ANBAR.style.transition = 'width ' + secs + 's linear'; ANBAR.style.width = '0%'; }));
      ST.anTimer = setTimeout(() => { AN.classList.remove('on'); if (ST.anEp) openEp(ST.anEp.n); }, secs * 1000);
    }
    function cancelAN() { clearTimeout(ST.anTimer); AN.classList.remove('on'); ST.anEp = null; ANBAR.style.transition = 'none'; ANBAR.style.width = '100%'; }
    ANCANCEL.addEventListener('click', cancelAN);
    ANNOW.addEventListener('click', () => { const nx = ST.anEp; cancelAN(); if (nx) openEp(nx.n); });
    AN.addEventListener('mouseenter', e => { const b = e.target.closest('.an-btn'); if (b) b.focus(); }, true);

    /* ══════════════════════════════════════════════
       WATCHDOG — 2 hour idle
       ══════════════════════════════════════════════ */
    function resetAct() { ST.lastAct = Date.now(); if (WD.classList.contains('on')) dimWD(); }
    function startWD() {
      stopWD();
      ST.wdTimer = setInterval(() => { if (!PS.classList.contains('active')) return; if (Date.now() - ST.lastAct >= ST.WD_MS) showWD(); }, 30000);
    }
    function stopWD() { clearInterval(ST.wdTimer); clearInterval(ST.wdCD); }
    function showWD() {
      VID.pause(); WD.classList.add('on');
      ST.wdSecs = 60; WDTIMER.textContent = '60';
      ST.wdCD = setInterval(() => { ST.wdSecs--; WDTIMER.textContent = ST.wdSecs; if (ST.wdSecs <= 0) { clearInterval(ST.wdCD); WD.classList.remove('on'); } }, 1000);
      requestAnimationFrame(() => WDYES.focus());
    }
    function dimWD() { clearInterval(ST.wdCD); WD.classList.remove('on'); VID.play().catch(() => { }); resetAct(); }
    WDYES.addEventListener('click', dimWD);

    /* ══════════════════════════════════════════════
       INIT
       ══════════════════════════════════════════════ */
    function init() {
      const savedVol = parseFloat(localStorage.getItem(LS.V) || '1');
      setVol(savedVol);
      restoreSpeed();
      renderSagas(); renderEps(); updResume();
      MS.classList.add('active');
      APL.style.transition = 'opacity .5s'; APL.style.opacity = '0';
      setTimeout(() => APL.style.display = 'none', 500);
      requestAnimationFrame(() => { const f = EPCONT.querySelector('.epc'); if (f) setFx(f); });
    }
    init();
  </script>
</body>

</html>
